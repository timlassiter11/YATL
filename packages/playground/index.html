<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>YATL Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      .filters-header {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      yatl-table-ui {
        width: 100%;
      }
    </style>
  </head>

  <body>
    <nav>
      <div class="nav-left">
        <span class="nav-title">YATL</span>
      </div>

      <div class="nav-right">
        <a
          href="https://github.com/timlassiter11/YATL"
          target="_blank"
          class="nav-link"
        >
          GitHub
        </a>
        <a
          href="https://timlassiter11.github.io/YATL/docs/index.html"
          class="nav-link"
        >
          Documentation
        </a>

        <yatl-notification-center></yatl-notification-center>

        <yatl-button id="themeToggle" variant="plain">
          <yatl-icon name="sun"></yatl-icon>
          <yatl-icon name="moon"></yatl-icon>
        </yatl-button>
      </div>
    </nav>

    <yatl-toast-manager></yatl-toast-manager>
    <main>
      <yatl-table-view>
        <div slot="filters" class="option-group">
          <yatl-search-filter field="name" label="Name"></yatl-search-filter>
          <yatl-select-filter
            field="status"
            label="Status"
            max-tags="1"
            multi
            clearable
          ></yatl-select-filter>
          <yatl-date-range-filter label="Date Modified" field="lastModified">
          </yatl-date-range-filter>
        </div>
        <div slot="sidebar-end" class="table-options">
          <span class="header-text">Table Options</span>
          <div class="option-group">
            <yatl-number-input
              label="Row Count"
              name="rowCount"
              id="rowCountInput"
              value="2000"
              min="0"
            ></yatl-number-input>
          </div>
          <form id="optionsForm" onsubmit="event.preventDefault();">
            <div class="option-group">
              <yatl-label>UI</yatl-label>
              <yatl-switch
                name="striped"
                label="Striped"
                always-include
                checked
              ></yatl-switch>
              <yatl-switch
                name="rowNumbers"
                label="Show Row Numbers"
                always-include
                checked
              ></yatl-switch>
              <yatl-switch
                name="hideFooter"
                label="Hide Footer"
                always-include
              ></yatl-switch>
            </div>
            <div class="option-group">
              <yatl-label>Interactivity</yatl-label>
              <yatl-switch
                name="resizable"
                label="Resizable Columns"
                always-include
                checked
              ></yatl-switch>
              <yatl-switch
                name="sortable"
                label="Sortable Columns"
                always-include
                checked
              ></yatl-switch>
              <yatl-switch
                name="reorderable"
                label="Rearrangable Columns"
                always-include
                checked
              ></yatl-switch>
            </div>
            <div class="option-group">
              <yatl-radio-group name="rowSelectionMethod">
                <yatl-label slot="label">Row Selection Method</yatl-label>
                <yatl-radio label="Multi" value="multi" checked></yatl-radio>
                <yatl-radio label="Single" value="single"></yatl-radio>
                <yatl-radio label="None" value="null"></yatl-radio>
              </yatl-radio-group>
            </div>
            <div class="option-group">
              <yatl-radio-group name="editTrigger">
                <yatl-label slot="label">Edit Trigger</yatl-label>
                <yatl-radio label="None" value="none"></yatl-radio>
                <yatl-radio label="Click" value="click"></yatl-radio>
                <yatl-radio
                  label="Double Click"
                  value="dblclick"
                  checked
                ></yatl-radio>
              </yatl-radio-group>
            </div>
            <div class="option-group">
              <yatl-radio-group name="commitStrategy">
                <yatl-label slot="label">Commit Strategy</yatl-label>
                <yatl-radio
                  label="Immediate"
                  value="immediate"
                  checked
                ></yatl-radio>
                <yatl-radio label="Row" value="row"></yatl-radio>
                <yatl-radio label="Batch" value="batch"></yatl-radio>
              </yatl-radio-group>
            </div>
            <div class="option-group">
              <yatl-label>Misc</yatl-label>
              <yatl-switch
                name="tokenizedSearch"
                label="Tokenize Search"
                always-include
                checked
              ></yatl-switch>
              <yatl-switch
                name="scoredSearch"
                label="Search Scoring"
                always-include
                checked
              ></yatl-switch>
              <yatl-switch
                name="virtualScroll"
                label="Virtual Scroll"
                always-include
                checked
              ></yatl-switch>
            </div>
          </form>
          <div class="header-text">Render State</div>
          <div class="option-group">
            <div class="inline">
              Rendered Rows: <span id="renderedRows">0</span>
            </div>
            <div class="inline">
              Filtered Rows: <span id="filteredRows">0</span>
            </div>
            <div class="inline">Total Rows: <span id="totalRows">0</span></div>
          </div>
        </div>
        <yatl-button
          id="saveChangesButton"
          slot="toolbar-button-group"
          title="Save pending changes"
          color="raised"
          disabled
        >
          <yatl-icon name="save"></yatl-icon>
        </yatl-button>
        <yatl-button
          id="discardChangesButton"
          slot="toolbar-button-group"
          title="Discard pending changes"
          color="raised"
          disabled
        >
          <yatl-icon name="close"></yatl-icon>
        </yatl-button>
        <yatl-button
          id="deleteRowsButton"
          slot="toolbar-button-group"
          title="Delete selected rows"
          color="raised"
          disabled
        >
          <yatl-icon name="trash"></yatl-icon>
        </yatl-button>
      </yatl-table-view>

      <yatl-flyout id="rowDetailsFlyout" label="Row Details">
        <div class="option-group">
          <div class="inline">
            <span>Status</span>
            <span id="rowDetailsStatus"></span>
          </div>
          <div class="inline">
            <span>Modified</span>
            <span id="rowDetailsModified"></span>
          </div>
          <div class="inline">
            <span>Issues</span>
            <span id="rowDetailsIssues"></span>
          </div>
        </div>
        <div class="option-group">
          <span>Tags</span>
          <div class="tag-list" id="rowDetailsTags"></div>
        </div>
        <yatl-button
          slot="footer-actions"
          color="danger"
          id="rowDetailsDeleteButton"
        >
          <yatl-icon name="trash"></yatl-icon>
          Delete Row
        </yatl-button>
      </yatl-flyout>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
